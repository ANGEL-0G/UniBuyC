<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniBuy-C Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #ffffff;
        }

        .container {
            width: 90%;
            max-width: 350px;
            text-align: center;
        }

        .logo {
            width: 120px;
            height: 120px;
            background: #e6e6e6;
            border-radius: 50%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-weight: bold;
        }

        h2 {
            margin-top: 15px;
            font-size: 22px;
            font-weight: bold;
        }

        .input-field {
            width: 100%;
            margin-top: 20px;
        }

        .input-field input {
            width: 100%;
            padding: 12px 5px;
            border: none;
            border-bottom: 1.5px solid #999;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            border-radius: 25px;
            border: none;
            background: #00a884;
            color: white;
            cursor: pointer;
        }

        .btn-outline {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border-radius: 25px;
            background: white;
            color: #009975;
            border: 2px solid #009975;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">LOGO</div>
        <h2>Bienvenid@ a<br>UniBuy-C</h2>

        <div class="input-field">
            <input type="email" id="email" placeholder="correo@example">
        </div>

        <div class="input-field">
            <input type="password" id="password" placeholder="Contraseña123@">
        </div>

        <button class="btn" onclick="login()">Iniciar Sesión</button>

        <button class="btn-outline" onclick="window.location.href='registro.html'">
            Registrarse
        </button>
    </div>

    <script>
        function login() {
            alert("Inicio de sesión de prueba.");
        }
    </script>
</body>
</html>
